[package]
name = "fsa"
version = "0.1.0"
edition = "2024"
description = "small real-time microphone processor for pipewire"
license = "MIT"

[dependencies]
anyhow = "1"
log = "0.4"
env_logger = "0.11"
rtrb = "0.4"
eframe = { version = "0.36", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
toml = "1"
clack-host = "0.2"
clack-extensions = { version = "0.2", features = ["clack-host", "audio-ports", "gui", "log", "params", "state", "timer", "posix-fd"] }
base64 = "0.23"
libc = "0.2"
nnnoiseless = { version = "0.5", default-features = false }

# lilv 0.2 doesn't build where c_char is unsigned (aarch64 linux)
[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
lilv = "0.2"
livi = "0.7"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_49"] }

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.18"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWindow", "NSView", "NSResponder", "NSGraphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }

[profile.release]
debug = 1
